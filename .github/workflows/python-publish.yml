# Uploads the package to PyPI when a release is published on GitHub
# Uses PyPI trusted publishing, so no PyPI password or token is stored in GitHub:
# https://docs.pypi.org/trusted-publishers/

name: Upload Python Package

on:
  release:
    types: [published]

jobs:
  deploy:

    runs-on: ubuntu-26.04
    environment: pypi
    permissions:
      # lets PyPI check this workflow is allowed to publish pinhook
      id-token: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'
    - name: Build package
      run: |
        python -m pip install --upgrade pip build
        python -m build
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
