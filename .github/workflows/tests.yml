# Runs the test suite on every supported Python version

name: Tests

on:
  push:
  pull_request:

jobs:
  test:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
    - name: Set up Python ${{ matrix.python-version }}
      run: uv venv --python ${{ matrix.python-version }}
    - name: Install dependencies
      run: uv pip install -e '.[toml,yaml]' pytest
    - name: Run tests
      run: uv run --no-project pytest

  style:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
    - name: Check PEP 8, with lines up to 100 characters (set in setup.cfg)
      run: uv run --no-project --python 3.12 --with pycodestyle==2.15.0 pycodestyle pinhook tests examples setup.py
