# Runs the test suite on every supported Python version

name: Tests

on:
  push:
  pull_request:

jobs:
  test:

    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v7
    - name: Set up uv
      uses: astral-sh/setup-uv@v10
    - name: Set up Python ${{ matrix.python-version }}
      run: uv venv --python ${{ matrix.python-version }}
    - name: Install dependencies
      run: uv pip install -e . pytest
    - name: Run tests
      run: uv run --no-project pytest

  style:

    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
    - name: Set up uv
      uses: astral-sh/setup-uv@v10
    - name: Check PEP 8, with lines up to 100 characters (set in setup.cfg)
      run: uv run --no-project --python 3.12 --with pycodestyle==2.15.0 pycodestyle pinhook tests examples setup.py

  mypy:

    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
    - name: Set up uv
      uses: astral-sh/setup-uv@v10
    - name: Set up Python
      run: uv venv --python 3.11
    - name: Install dependencies
      run: uv pip install -e . mypy==2.4.1 types-PyYAML==6.0.12.20260906
    - name: Check types (settings in setup.cfg)
      run: uv run --no-project mypy

  integration:

    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
    - name: Set up uv
      uses: astral-sh/setup-uv@v10
    - name: Set up Python
      run: uv venv --python 3.12
    - name: Install dependencies
      run: uv pip install -e . pytest
    - name: Start an Ergo IRC server
      run: tests/integration/ergo.sh
    - name: Run tests against Ergo
      run: uv run --no-project pytest tests/integration
      env:
        PINHOOK_ERGO: 127.0.0.1
    - name: Show Ergo's log
      if: failure()
      run: cat .ergo/ergo.log
