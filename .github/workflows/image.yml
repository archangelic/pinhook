# Publishes ghcr.io/archangelic/pinhook when a release is published on GitHub, for amd64
# and arm64, tagged with the version and its minor and major, like 2.0.0, 2.0 and 2.
# Pre-releases get only their own version tag. The image is signed with cosign, using
# this workflow's identity, and published with an SBOM and build provenance.
#
# Check a signature with:
#   cosign verify ghcr.io/archangelic/pinhook:2 \
#     --certificate-identity-regexp '^https://github.com/archangelic/pinhook/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com

name: Publish Image

on:
  release:
    types: [published]

jobs:
  image:

    # 1.x releases come from the 1.x branch, which has no image
    if: ${{ !startsWith(github.event.release.tag_name, 'v1.') }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      # cosign's keyless signing
      id-token: write

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: docker/setup-qemu-action@v4
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/archangelic/pinhook
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
    - id: build
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        sbom: true
        provenance: mode=max
    - uses: sigstore/cosign-installer@v4.1.2
    - name: Sign the image
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: cosign sign --yes "ghcr.io/archangelic/pinhook@$DIGEST"
