site_name: pinhook
site_description: python irc bot framework
site_url: https://archangelic.github.io/pinhook/
repo_url: https://github.com/archangelic/pinhook
repo_name: archangelic/pinhook
edit_uri: edit/master/docs/

# installed from here, not part of the site
exclude_docs: |
  requirements.txt

validation:
  links:
    anchors: warn

nav:
  - Home: index.md
  - Getting started:
    - Install: install.md
    - Your first bot: your-first-bot.md
    - Configuration: configuration.md
  - Plugins:
    - The context: the-context.md
    - Typed commands: typed-commands.md
    - Events: events.md
    - Timers: timers.md
    - Class plugins & reload: class-plugins-and-reload.md
  - Recipes:
    - Writing recipes: writing-recipes.md
    - Templates & filters: templates-and-filters.md
  - Access:
    - Access levels: access-levels.md
    - Grants & denies: grants-and-denies.md
    - Bans and ops: bans-and-ops.md
  - Reference:
    - IRCv3 support: ircv3-support.md
    - Twitch: twitch.md
    - TestBot: testbot.md
    - Command line: command-line.md
    - Deployment: deployment.md
    - Options: options.md
    - Built-in commands: built-in-commands.md
    - API reference: api-reference.md
    - Troubleshooting: troubleshooting.md
  - Upgrading:
    - Migrating from 1.x: migrating-from-1x.md
    - Changelog: changelog.md

theme:
  name: material
  # templates for the homepage, favicons and link previews
  custom_dir: overrides
  logo: assets/brand/pinhook-horizontal-reverse.svg
  favicon: assets/brand/pinhook-favicon.ico
  # fonts are served from docs/assets/fonts, Google Fonts can't load the weights the brand uses
  font: false
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# colors and type from the pinhook brand kit
extra_css:
  - assets/brand.css

extra:
  version:
    provider: mike
  # vermilion's homepage, which turns on the homepage's vermilion band once it's set
  vermilion_url:

plugins:
  # listed here because adding any plugin turns off the default search
  - search
  - mkdocstrings:
      handlers:
        python:
          # read from the source, so pinhook doesn't need installing to build the docs
          paths: [.]
          options:
            docstring_style: google
            show_signature_annotations: true
            docstring_options:
              warn_missing_types: false
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            heading_level: 3
            filters: ["!^_"]
            separate_signature: true

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
